services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saas_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate && 
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_NAME: saas_db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

  # Worker dedicated to fast background tasks (M-Pesa, emails, light jobs)
  celery_default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info -Q celery
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_NAME: saas_db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

  # Worker dedicated exclusively to heavy timetable calculations.
  # --concurrency is set explicitly rather than left at Celery's default
  # (one process per CPU core): CP-SAT/OR-Tools solves are CPU-heavy on
  # their own, and if the solver ever uses internal multi-threading too,
  # an uncapped per-core worker pool here can oversubscribe the host and
  # make every concurrent solve slower rather than improving throughput.
  # 2 is a starting point, not a measured number — tune it against your
  # actual host's core count and how many tenants realistically generate
  # timetables at the same time.
  celery_timetable:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info -Q timetable_solver --concurrency=2
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_NAME: saas_db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

volumes:
  postgres_data: